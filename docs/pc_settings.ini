# Copy to build/local-pc/settings.ini, or pass --config /path/to/settings.ini.
# F1 opens PC settings; F2 opens audio diagnostics; F5 opens adventure tools.
# Changes persist immediately. See docs/pc_qol.md for adventure controls.
widescreen=0
reduceFlashes=0
# 0 original, 1 high contrast, 2 blue/gold, 3 monochrome
palette=0
# Final-window filter: 0 nearest, 1 bilinear, 2 soft CRT, 3 xBR level 2.
videoFilter=0
filterStrength=75
bugFixes=0
masterVolume=100
effectsVolume=100
musicVolume=100
controller=0
# Adventure gameplay assists are independently optional.
quickItems=0
spellShortcuts=0
protectSubweapon=0
warpChooser=0
skipSeenDialogue=0
statusHud=0
# HUD: 100, 125 or 150 percent. Subtitles: 0 original, 1 small, 2 medium, 3 large.
hudScale=100
subtitleScale=0
# Optional local translation/asset/audio pack directory.
contentPack=
# key0..key15 contain SDL scancodes; button0..button15 contain SDL button IDs.
# Actions: L2,R2,L1,R1,Triangle,Circle,Cross,Square,Select,L3,R3,Start,Up,Right,Down,Left.
# Rebind interactively in F1 settings. -2/-3 are the left/right triggers.
