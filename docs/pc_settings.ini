# Copy to build/local-pc/settings.ini, or pass --config /path/to/settings.ini.
# F1 opens PC settings; F2 opens an audio snapshot. Changes persist immediately.
widescreen=0
reduceFlashes=0
# 0 original, 1 high contrast, 2 blue/gold, 3 monochrome
palette=0
bugFixes=0
masterVolume=100
effectsVolume=100
musicVolume=100
controller=0
# Optional local translation/asset/audio pack directory.
contentPack=
# key0..key15 contain SDL scancodes; button0..button15 contain SDL button IDs.
# Actions: L2,R2,L1,R1,Triangle,Circle,Cross,Square,Select,L3,R3,Start,Up,Right,Down,Left.
# Rebind interactively in F1 settings. -2/-3 are the left/right triggers.
